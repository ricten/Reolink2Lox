[AUTHOR]
NAME=Rico Tengler
EMAIL=rico@cod-lan.de

[PLUGIN]
VERSION=0.1.1
NAME=reolink2lox
FOLDER=reolink2lox
TITLE=Reolink2Lox
WEBSITE=https://github.com/ricten/Reolink2Lox

[AUTOUPDATE]
# true: neue Installationen bekommen automatische Release-Updates (LoxBerry liest RELEASECFG, Format siehe release.cfg im Repo)
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/ricten/Reolink2Lox/main/release.cfg
PRERELEASECFG=

[SYSTEM]
REBOOT=false
LB_MINIMUM=4.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
# true: LoxBerry zeigt die Loglevel-Auswahl in der Plugin-Verwaltung (Installer: SYSTEM.CUSTOM_LOGLEVELS)
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
